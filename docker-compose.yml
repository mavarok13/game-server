services:
  game-server:
    build: .
    image: game-server:local
    ports:
      - "8080:8080"
    environment:
      GAME_DB_URL: "postgres://game:game@postgres:5432/game"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - game-server-saves:/app/game_server_saves

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: game
      POSTGRES_USER: game
      POSTGRES_PASSWORD: game
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d game"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  game-server-saves:
  postgres-data:
